# Structure, not style. This repository is prose-heavy documentation with
# mermaid fences and long reference sentences, so the rules that would
# fight that shape (line length, bare-URL bans, first-line heading) are off;
# the rules that catch a genuinely broken document stay on.
config:
  default: true
  MD013: false # line-length — prose wraps for readability, not a hard rule
  MD033: false # inline HTML — none used deliberately, not banned
  MD041: false # first line must be a top-level heading — front matter varies
  MD024: # duplicate headings — allow across different sibling sections
    siblings_only: true
gitignore: true
