name: package-release
description: >-
  The Billy-Company OSS release contract: version parity, changelog fragment
  quality, tag-on-branch and CI-green gating, and registry-idempotency
  probes — one implementation, called byte-identically from every
  publishable repo's ci.yml and release.yml.
inputs:
  command:
    description: >-
      version | changelog | notes | ci-status | tag-ancestor |
      registry-probe | selftest — see validate.py's module docstring for each
      command's arguments.
    required: true
  args:
    description: Remaining CLI arguments, with POSIX quotes for spaces; never shell-expanded.
    required: false
    default: ""
outputs:
  result:
    description: The command's last stdout line, including on failure; see the README for each result.
    value: ${{ steps.run.outputs.result }}
runs:
  using: composite
  steps:
    # Parse the existing API once to discover tools; ordinary Cargo version
    # calls and the five other commands pay no unnecessary compiler setup.
    - id: prepare
      shell: bash
      env:
        RELEASE_COMMAND: ${{ inputs.command }}
        RELEASE_ARGS: ${{ inputs.args }}
      run: python3 "$GITHUB_ACTION_PATH/_run.py" --prepare

    - if: steps.prepare.outputs.zig == 'true'
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.16.0
        use-cache: false

    # Only `changelog` and `selftest` shell out to a real towncrier.
    - if: steps.prepare.outputs.towncrier == 'true'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.17"
        enable-cache: false

    - id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_COMMAND: ${{ inputs.command }}
        RELEASE_ARGS: ${{ inputs.args }}
      run: python3 "$GITHUB_ACTION_PATH/_run.py"
